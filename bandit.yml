# Read by Codacy's Bandit only (it passes -c bandit.yml); the Bandit workflow
# gates lib/ at MEDIUM severity and does not use this file. Match that gate:
# tests/ only talks to loopback fixtures, and these low-severity checks fire on
# every argv-list subprocess call and best-effort cleanup.
exclude_dirs:
  - tests
skips:
  - B110  # try/except/pass
  - B112  # try/except/continue
  - B404  # import subprocess
  - B603  # subprocess without shell=True
  - B607  # executable looked up on PATH
