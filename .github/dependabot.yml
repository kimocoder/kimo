# Dependabot version updates. The only third-party dependencies with a
# manifest are the GitHub Actions used by the workflows (pinned by commit SHA
# with the version in a trailing comment, which Dependabot keeps in sync).
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let a new action release age a week before proposing it, so a
    # compromised or broken release has time to be caught and pulled.
    cooldown:
      default-days: 7
