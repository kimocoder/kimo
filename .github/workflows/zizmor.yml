# zizmor audits the GitHub Actions workflows (and dependabot.yml) for security
# problems CodeQL's Actions queries miss: template injection in run: blocks,
# overly broad permissions, credentials persisted by actions/checkout, risky
# triggers, unpinned actions. Findings go to code scanning under "zizmor".
# Docs: https://docs.zizmor.sh

name: zizmor

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "**" ]
  schedule:
    # Online audits (e.g. newly published advisories for pinned actions)
    # change without a commit.
    - cron: '23 6 * * 1'

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to check out the workflows
      actions: read # for upload-sarif to read the run status
      security-events: write # to upload SARIF results
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # The action otherwise runs whatever zizmor is "latest"; it pulls this
          # version's image by digest.
          version: 1.30.1
          persona: regular
