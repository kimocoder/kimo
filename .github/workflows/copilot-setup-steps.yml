# Prepares the environment GitHub Copilot coding agent works in before it
# starts on a task, so it can run the same checks CI does: make check, make lint
# (shellcheck + ruff + the 8 KiB boundary check) and make test, plus the Bandit
# gate from bandit.yml. External CLIs (claude, kimi, codex, ...) are not
# installed: the test harness stubs them.
#
# The job must be named copilot-setup-steps. The triggers below only let the
# setup itself be tested from the Actions tab or on changes to this file.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same toolset as makefile.yml: make lint fails without shellcheck or
      # ruff, and tomlkit backs the kimi/grok config paths the tests exercise.
      - name: Install lint and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq python3-tomlkit
          pipx install ruff==0.16.8
          pipx install bandit

      # Fails the setup early if the toolchain is incomplete.
      - name: Verify the toolchain
        run: |
          shellcheck --version | head -n 2
          ruff --version
          bandit --version | head -n 1
          make check
