name: Makefile CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    # make lint fails when shellcheck or ruff is missing; tomlkit backs the
    # kimi/grok config-alias paths the launch tests exercise.
    - name: Install lint and test tools
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck jq python3-tomlkit
        pipx install ruff==0.16.8

    - name: Run check
      run: make check

    - name: Run lint (shellcheck -S warning + ruff)
      run: make lint

    - name: Run test suite
      run: make test
