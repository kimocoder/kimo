name: Makefile CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # make lint fails when shellcheck or ruff is missing; tomlkit backs the
    # kimi/grok config-alias paths the launch tests exercise.
    - name: Install lint and test tools
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck jq python3-tomlkit
        pipx install ruff==0.16.8

    - name: Run check
      run: make check

    - name: Run lint (shellcheck -S warning + ruff)
      run: make lint

    - name: Run test suite
      run: make test
